services:
  dashboard-finanzas:
    build: .
    image: dashboard-finanzas:latest
    container_name: dashboard-finanzas
    restart: unless-stopped
    env_file:
      - app.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DEBUG: "false"
      DATABASE_PATH: /app/data/dashboard.db
      UPLOADS_DIR: /app/data/uploads
      BACKUPS_DIR: /app/data/backups
      LOGS_DIR: /app/data/logs
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dashboard-finanzas-email-importer:
    profiles: ["email"]
    image: dashboard-finanzas:latest
    container_name: dashboard-finanzas-email-importer
    restart: unless-stopped
    depends_on:
      dashboard-finanzas:
        condition: service_healthy
    env_file:
      - app.env
    environment:
      DEBUG: "false"
      DATABASE_PATH: /app/data/dashboard.db
      UPLOADS_DIR: /app/data/uploads
      BACKUPS_DIR: /app/data/backups
      LOGS_DIR: /app/data/logs
    command: ["python", "scripts/run_email_importer.py", "--poll"]
    volumes:
      - ./data:/app/data
